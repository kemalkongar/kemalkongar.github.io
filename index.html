<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Kemal Kongar, Portfolio Analyst @ Select Equity Group">
    <meta name="theme-color" content="#0a1628">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Kemal Kongar</title>
    <link rel="canonical" href="https://www.kemalkongar.com/">
    <meta property="og:type" content="profile">
    <meta property="og:title" content="Kemal Kongar">
    <meta property="og:description" content="Kemal Kongar, Portfolio Analyst @ Select Equity Group">
    <meta property="og:url" content="https://www.kemalkongar.com/">
    <meta property="og:site_name" content="Kemal Kongar">

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            background: #0a1628;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100svh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 20px;
        }

        .card {
            background: #f5f0eb;
            max-width: 720px;
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            padding: 40px 52px;
        }

        h1 {
            color: #0a1628;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .title {
            color: #4b5563;
            font-size: 1.05rem;
            font-weight: 400;
            margin-top: 6px;
        }

        .subtle-link {
            color: inherit;
            text-decoration: underline;
            text-decoration-style: dotted;
            text-decoration-color: #9ca3af;
            text-underline-offset: 3px;
            transition: text-decoration-color 0.2s;
        }

        .subtle-link:hover {
            text-decoration-color: #5a6070;
        }

        a:focus-visible {
            border-radius: 2px;
            outline: 2px solid #0a1628;
            outline-offset: 4px;
        }

        .divider {
            border: none;
            border-top: 1.5px solid #0a1628;
            opacity: 0.15;
            margin: 28px 0;
        }

        h2 {
            color: #0a1628;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        p {
            color: #1f2937;
            font-size: 1rem;
            line-height: 1.65;
        }

        .links {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .links a {
            color: #0a1628;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .links .sep {
            color: #9ca3af;
            user-select: none;
        }

        .finance-canvas {
            display: block;
            width: 100%;
            height: 100px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 24px;
            }

            .finance-canvas {
                height: 130px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .subtle-link {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Kemal Kongar</h1>
        <p class="title">Portfolio Analyst @ <a href="https://www.selectequity.com/" target="_blank"
                rel="noopener" class="subtle-link">Select Equity Group</a></p>

        <hr class="divider">

        <h2>About</h2>
        <p>
            I apply quantitative methods and data analytics across capital markets. I've worked in the industry since
            2021 and hold a Bachelor's degree in Computer Science and Political Science from McGill University.
        </p>

        <hr class="divider">

        <nav class="links" aria-label="Contact">
            <a href="https://www.linkedin.com/in/kemalkongar" target="_blank" rel="noopener">LinkedIn</a>
            <span class="sep" aria-hidden="true">&middot;</span>
            <a href="mailto:contact@kemalkongar.com">Email</a>
        </nav>

        <hr class="divider">
        <canvas class="finance-canvas" id="financeCanvas" aria-hidden="true"></canvas>
    </main>

    <script src="canvas.js"></script>
</body>

</html>
